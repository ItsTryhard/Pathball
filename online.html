<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.addEventListener("error", e => alert(e.message));</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathball — Play online</title>
    <link rel="icon" type="image/svg+xml" href="pilka.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameScreen" class="screen">
        <img class="pathballLogo gameLogo" src="paths_ball_logo-v3.svg" alt="Pathball">

        <div class="score">
            <div class="player"><span class="blueDot"></span>Player 1<strong id="score1">0</strong></div>
            <div class="player"><span class="redDot"></span>Player 2<strong id="score2">0</strong></div>
        </div>
        <div id="turnInfo">Player 1's turn</div>
        <div class="fieldContainer">
            <canvas id="gameCanvas" width="780" height="1140"></canvas>
        </div>
        <p class="instructions">Click on a neighboring point to move the ball.</p>
        <button class="newGame" onclick="restartClick()">New game</button>
        <button class="backButton" onclick="backToMenu()">Back to menu</button>
        <button id="orientationToggle" class="orientationToggle" onclick="toggleOrientation()"
            aria-label="Switch to landscape layout" aria-pressed="false" title="Switch to landscape layout">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7h5V2M7 7a8 8 0 1 1-2.34 5.66" />
            </svg>
        </button>
    </div>

    <div id="onlineLobby" class="lobbyOverlay hidden">
        <div class="menuCard lobbyCard">
            <p class="eyebrow">PLAY ONLINE</p>
            <p id="lobbyStatus" class="lobbyStatus"></p>
            <div id="lobbyChoices" class="buttons">
                <button id="lobbyQuick">Quick match</button>
                <button id="lobbyCreate">Create private room</button>
                <button id="lobbyJoin">Join with code</button>
                <button onclick="backToMenu()">Back to menu</button>
            </div>
            <div class="buttons">
                <button id="lobbyCancel" class="hidden">Cancel</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script type="module" src="online.js"></script>
    <script>
        window.addEventListener("load", () => window.playOnline());
    </script>
</body>
</html>
