
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="mainMenu" class="screen">
        <div class="menuCard">
            <p class="eyebrow">TACTICAL TABLE SOCCER</p>
            <img
                class="pathballLogo menuLogo"
                src="paths_ball_logo-v3.svg"
                alt="Pathball"
            >
            <p class="subtitle">Choose your game mode</p>

            <div class="buttons">
                <button onclick="playFriend()">Play vs friend</button>
                <button onclick="playBot()">Play vs bot</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden">

        <img
            class="pathballLogo gameLogo"
            src="paths_ball_logo-v3.svg"
            alt="Pathball"
        >

        <div class="score">
            <div class="player">
                <span class="blueDot"></span>
                Player 1
                <strong id="score1">0</strong>
            </div>

            <div class="player">
                <span class="redDot"></span>
                Player 2
                <strong id="score2">0</strong>
            </div>
        </div>

        <div id="turnInfo">Player 1's turn</div>

        <div class="fieldContainer">
            <canvas id="gameCanvas" width="780" height="1140"></canvas>
        </div>

        <p class="instructions">
            Click on a neighboring point to move the ball.
        </p>

        <button class="newGame" onclick="newGame()">
            New game
        </button>

        <button class="backButton" onclick="backToMenu()">
            Back to menu
        </button>

        <button
            id="orientationToggle"
            class="orientationToggle"
            onclick="toggleOrientation()"
            aria-label="Switch to landscape layout"
            aria-pressed="false"
            title="Switch to landscape layout"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7h5V2M7 7a8 8 0 1 1-2.34 5.66" />
            </svg>
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
