
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="mainMenu" class="screen">
        <h1>CHECKERS</h1>
        <p class="subtitle">Choose your game mode</p>

        <div class="buttons">
            <button onclick="playFriend()">Play vs friend</button>
            <button onclick="playBot()">Play vs bot</button>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden">
        <h1 id="gameTitle">Game</h1>

        <div class="emptyBoard">
            <p>The game will appear here.</p>
        </div>

        <button class="backButton" onclick="backToMenu()">
            Back to menu
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
